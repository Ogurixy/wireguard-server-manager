name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore WireGuardServerManager.Tests/WireGuardServerManager.Tests.csproj

      - name: Test core
        run: dotnet test WireGuardServerManager.Tests/WireGuardServerManager.Tests.csproj --configuration Release --no-restore

      - name: Build Windows app
        run: dotnet build WireGuardServerManager.App/WireGuardServerManager.App.csproj --configuration Release
